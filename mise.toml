[tasks.build]
description = "Build workmux for production"
run = "cargo build --release --locked --bin workmux"

[tasks.deploy]
description = "Build and atomically install workmux to bin"
depends = ["build"]
run = """
set -eu
mkdir -p bin
tmp=$(mktemp bin/.workmux.XXXXXX)
trap 'rm -f "$tmp"' EXIT
cp -p target/release/workmux "$tmp"
mv -f "$tmp" bin/workmux
"""
