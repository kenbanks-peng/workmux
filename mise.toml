[tasks."sandbox"]
description = "Build the local Pi sandbox image with Apple Container"
run = "container build -t workmux-sandbox-dev:latest -f Dockerfile.sandbox ."

[tasks.build]
description = "Build workmux for production"
run = "cargo build --release --locked --bin workmux"

[tasks.deploy]
description = "Build and copy workmux to bin"
depends = ["build"]
run = """
mkdir -p bin
cp target/release/workmux bin/workmux
"""
