# Based on ~/.config/omposh/prompt-herdr.toml.
# Built-in segments keep this independent of host-specific shell hooks.
"$schema" = "https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json"
version = 4
final_space = true
shell_integration = true
pwd = 'osc7'

[palette]
shell = '#005b95'
shell-foreground = '#e5eaf0'
root = '#a90000'
root-foreground = '#f4e4e5'
directory = '#2f40c2'
directory-foreground = '#e5e6f2'
git = '#006b1d'
git-foreground = '#e5ece6'
git-modified = '#a17a00'
git-diverged = '#8c0888'
status = '#005b95'
status-foreground = '#e5eaf0'
status-error = '#a90000'
exectime-foreground = '#e5eaf0'
prompt = '#f55c1b'
secondary = '#a90000'
secondary-accent = '#a17a00'

[secondary_prompt]
template = '<p:secondary,transparent></><,p:secondary-accent> > </><p:secondary-accent,transparent></> '
foreground = 'p:secondary'
background = 'transparent'

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
type = 'os'
style = 'diamond'
leading_diamond = ''
trailing_diamond = ''
background = 'p:shell'
foreground = 'p:shell-foreground'
template = ' {{ .Icon }} '

[[blocks.segments]]
type = 'root'
style = 'diamond'
leading_diamond = ''
trailing_diamond = ''
foreground = 'p:root-foreground'
background = 'p:root'
template = '  '

[[blocks.segments]]
type = 'path'
style = 'diamond'
leading_diamond = ''
trailing_diamond = ''
background = 'p:directory'
foreground = 'p:directory-foreground'
template = ' {{ .Path }} '
options = { style = 'folder' }

[[blocks.segments]]
type = 'git'
style = 'diamond'
leading_diamond = ''
trailing_diamond = ''
background = 'p:git'
foreground = 'p:git-foreground'
template = ' {{ .HEAD }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .Ahead 0 }} ↑{{ .Ahead }}{{ end }}{{ if gt .Behind 0 }} ↓{{ .Behind }}{{ end }} '
background_templates = [
  '{{ if or .Working.Changed .Staging.Changed }}p:git-modified{{ end }}',
  '{{ if or (gt .Ahead 0) (gt .Behind 0) }}p:git-diverged{{ end }}',
]
options = { branch_template = '{{ trunc 25 .Branch }}', fetch_status = true }

[[blocks.segments]]
type = 'status'
style = 'accordion'
leading_powerline_symbol = '<transparent,background></>'
powerline_symbol = ''
background = 'p:status'
foreground = 'p:status-foreground'
template = '   '
background_templates = ['{{ if gt .Code 0 }}p:status-error{{ end }}']
options = { always_enabled = true }

[[blocks]]
type = 'prompt'
alignment = 'right'

[[blocks.segments]]
type = 'executiontime'
style = 'plain'
foreground = 'p:exectime-foreground'
template = '󰄉 {{ .FormattedMs }} '
options = { threshold = 1000 }

[[blocks]]
type = 'prompt'
alignment = 'left'
newline = true

[[blocks.segments]]
type = 'text'
style = 'plain'
background = 'transparent'
foreground = 'p:prompt'
template = '❯'
